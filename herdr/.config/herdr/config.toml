onboarding = false

[keys]
prefix = "ctrl+b"  # herdr-prefix
navigate_workspace_up = ["up", "k"]
navigate_workspace_down = ["down", "j"]

# vim-herdr-navigation (make herdr-plugins): ctrl+h/j/k/l moves between herdr
# panes, or is forwarded to Vim/Neovim when it runs in the focused pane.
# Change `key` to use other chords; Vim still receives ctrl+h/j/k/l.
[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "vim-herdr-navigation.left"
description = "navigate left (vim/herdr)"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "vim-herdr-navigation.down"
description = "navigate down (vim/herdr)"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "vim-herdr-navigation.up"
description = "navigate up (vim/herdr)"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "vim-herdr-navigation.right"
description = "navigate right (vim/herdr)"

[theme]
name = "catppuccin"
auto_switch = false

# BEGIN herdr-prefix (managed; edits here are overwritten)
[[keys.command]]
key = "prefix+ctrl+a"
type = "shell"
command = "$HOME/.config/herdr/herdr-prefix set ctrl+a"
description = "switch prefix to ctrl+a"

[[keys.command]]
key = "prefix+ctrl+space"
type = "shell"
command = "$HOME/.config/herdr/herdr-prefix set ctrl+space"
description = "switch prefix to ctrl+space"

# END herdr-prefix
