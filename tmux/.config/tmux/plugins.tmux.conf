# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-copycat'

set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @resurrect-strategy-vim 'session'
set -g @resurrect-strategy-nvim 'session'
if-shell 'case "$XDG_STATE_HOME" in /*) exit 0 ;; *) exit 1 ;; esac' \
  'set-option -g @resurrect-dir "$XDG_STATE_HOME/tmux/resurrect"' \
  'set-option -g @resurrect-dir "$HOME/.local/state/tmux/resurrect"'

set -g @plugin 'tmux-plugins/tmux-continuum'
# set -g @continuum-restore 'on'

# Plugin restore is explicit (`make tmux-plugins`); tmux startup stays offline.
if-shell 'case "$XDG_DATA_HOME" in /*) exit 0 ;; *) exit 1 ;; esac' \
  'set-environment -g TMUX_PLUGIN_MANAGER_PATH "$XDG_DATA_HOME/tmux/plugins"' \
  'set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.local/share/tmux/plugins"'
set-option -gu @dotfiles_tpm
if-shell 'test -x "$TMUX_PLUGIN_MANAGER_PATH/tpm/tpm"' \
  'run-shell -b "$TMUX_PLUGIN_MANAGER_PATH/tpm/tpm"' \
  'set-option -g @dotfiles_tpm missing'
