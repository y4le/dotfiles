# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-copycat'

set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @resurrect-strategy-vim 'session'
set -g @resurrect-strategy-nvim 'session'

set -g @plugin 'tmux-plugins/tmux-continuum'
# set -g @continuum-restore 'on'

# Plugin restore is explicit (`make tmux-plugins`); tmux startup stays offline.
set-option -gu @dotfiles_tpm
if-shell 'test -x "$HOME/.tmux/plugins/tpm/tpm"' \
  'run-shell -b "$HOME/.tmux/plugins/tpm/tpm"' \
  'set-option -g @dotfiles_tpm missing'
