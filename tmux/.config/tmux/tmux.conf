# Panes inside tmux belong to tmux, even when its server starts inside Herdr.
set-environment -gu HERDR_ENV
set-environment -gu HERDR_PANE_ID
set-environment -gu HERDR_TAB_ID
set-environment -gu HERDR_WORKSPACE_ID
set-environment -gu HERDR_SESSION
set-environment -gu HERDR_SOCKET_PATH

# Use ZSH
set -g default-shell "$SHELL"

# Set prefix to Ctrl-B by default
source-file ~/.config/tmux/prefix_b.tmux.conf

# Clear root bindings left by the older resize-mode config on reload.
unbind-key -n -q h
unbind-key -n -q H
unbind-key -n -q j
unbind-key -n -q J
unbind-key -n -q k
unbind-key -n -q K
unbind-key -n -q l
unbind-key -n -q L
unbind-key -n -q =
unbind-key -n -q %
unbind-key -n -q '"'
unbind-key -n -q f
unbind-key -n -q Escape
unbind-key -n -q q

# Resize and layout keys stay in a client key table until Escape or q.
bind r switch-client -T resize \; display-message "Resize Mode"
bind -T resize h resize-pane -L 5 \; switch-client -T resize
bind -T resize H resize-pane -L 25 \; switch-client -T resize
bind -T resize j resize-pane -D 5 \; switch-client -T resize
bind -T resize J resize-pane -D 25 \; switch-client -T resize
bind -T resize k resize-pane -U 5 \; switch-client -T resize
bind -T resize K resize-pane -U 25 \; switch-client -T resize
bind -T resize l resize-pane -R 5 \; switch-client -T resize
bind -T resize L resize-pane -R 25 \; switch-client -T resize
bind -T resize = select-layout tiled \; switch-client -T resize
bind -T resize % select-layout even-horizontal \; switch-client -T resize
bind -T resize '"' select-layout even-vertical \; switch-client -T resize
bind -T resize f select-layout main-vertical \; switch-client -T resize
bind -T resize Escape switch-client -T root
bind -T resize q switch-client -T root

# Use vi keys in copy mode and Emacs keys in command prompts.
set -gw mode-keys vi
# tmux-sensible previously supplied Emacs-style editing for command prompts.
set -g status-keys emacs

# immediately pass escape key through
set -s escape-time 0

# Preserve the useful tmux-sensible defaults explicitly.
set -g history-limit 50000
set -s focus-events on
set -g display-time 4000
set -g status-interval 5

# Mouse support
set -g mouse on

# 256 color support
set -g default-terminal "screen-256color"

# Allow OSC 52 clipboard escape sequences to pass through to the terminal
set -g allow-passthrough on
set -g set-clipboard on

# Start window numbers from 1
set -g base-index 1

# set up window and pane naming
set -g set-titles on
set -g set-titles-string '#{window_name} [#{session_name}](#{pane_title})'

# New windows/panes keep the same directory as current window
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# better vi-like copy mode, sends to system clipboard if `cpy` script is present
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'cpy'
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi V send-keys -X rectangle-toggle

# Source machine-local overrides before shared navigation and status settings.
if "test -f ~/.config/tmux/local.conf" "source ~/.config/tmux/local.conf"

# allow for C-h/j/k/l to navigate between vim and tmux panes
source-file ~/.config/tmux/vim_tmux_navigator.tmux.conf
source-file ~/.config/tmux/status_bar.tmux.conf

bind R source-file ~/.config/tmux/tmux.conf \; display-message "Configuration reloaded."
