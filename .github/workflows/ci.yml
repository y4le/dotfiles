name: ci

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workflow-lint:
    name: actionlint
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install actionlint
        run: |
          sh mk/pinned.sh install actionlint "$RUNNER_TEMP/actionlint" 0755
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Lint workflows
        run: make check-actions

  check:
    name: make check (${{ matrix.label }})
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux
            runs_on: ubuntu-24.04
          - label: macos
            runs_on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Linux check toolchain
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck stow tmux vim zsh

      - name: Install macOS check toolchain
        if: runner.os == 'macOS'
        run: HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1 brew install shellcheck stow tmux

      - name: Show check toolchain
        run: |
          make --version | head -1
          stow --version
          shellcheck --version
          tmux -V
          zsh --version
          command -v bash
          bash --version | head -1

      - name: Install pinned Neovim for runtime checks
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          make mise
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          MISE_GLOBAL_CONFIG_FILE="$PWD/mise/.config/mise/config.toml" \
            "$HOME/.local/bin/mise" install "aqua:neovim/neovim"
          nvim_bin="$(MISE_GLOBAL_CONFIG_FILE="$PWD/mise/.config/mise/config.toml" \
            "$HOME/.local/bin/mise" which nvim)"
          "$nvim_bin" --version | head -1
          make nvim-lazy

      - name: Run repo checks
        env:
          HTTPS_PROXY: http://127.0.0.1:9
          HTTP_PROXY: http://127.0.0.1:9
          ALL_PROXY: http://127.0.0.1:9
          MISE_OFFLINE: "1"
        run: make -k check

      - name: Ensure checks leave the repo clean
        if: always()
        run: |
          status="$(git status --porcelain --ignored --untracked-files=all)"
          if [ -n "$status" ]; then
            printf '%s\n' "$status"
            exit 1
          fi

  setup-smoke-linux:
    name: make setup smoke (linux)
    runs-on: ubuntu-24.04
    if: github.event_name == 'workflow_dispatch'
    needs:
      - check
      - workflow-lint
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare clean HOME
        run: |
          smoke_home="$RUNNER_TEMP/smoke-home"
          mkdir -p "$smoke_home"
          {
            echo "SMOKE_HOME=$smoke_home"
            echo "XDG_CONFIG_HOME=$smoke_home/.config"
            echo "XDG_DATA_HOME=$smoke_home/.local/share"
            echo "XDG_STATE_HOME=$smoke_home/.local/state"
            echo "XDG_CACHE_HOME=$smoke_home/.cache"
          } >> "$GITHUB_ENV"

      - name: Run bootstrap smoke test
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: HOME="$SMOKE_HOME" make setup

      - name: Verify bootstrap outputs
        run: |
          test -L "$SMOKE_HOME/.vimrc"
          test -L "$SMOKE_HOME/.zshrc"
          test "$(readlink -f "$SMOKE_HOME/.config/nvim/init.lua")" = \
            "$(readlink -f "$GITHUB_WORKSPACE/nvim/.config/nvim/init.lua")"
          HOME="$SMOKE_HOME" sh mk/pinned.sh status vim-plug "$SMOKE_HOME/.vim/autoload/plug.vim"
          test ! -e "$SMOKE_HOME/.local/share/vim/plugged/fzf/bin/fzf"
          test ! -L "$SMOKE_HOME/.local/share/vim/plugged/fzf/bin/fzf"
          HOME="$SMOKE_HOME" sh mk/pinned.sh status mise "$SMOKE_HOME/.local/bin/mise"
          test -x "$SMOKE_HOME/.local/bin/mise"
          HOME="$SMOKE_HOME" sh mk/pinned.sh status sheldon "$SMOKE_HOME/.local/bin/sheldon"
          test -x "$SMOKE_HOME/.local/bin/sheldon"
          HOME="$SMOKE_HOME" MISE_GLOBAL_CONFIG_FILE="$GITHUB_WORKSPACE/mise/.config/mise/config.toml" \
            "$SMOKE_HOME/.local/bin/mise" which nvim >/dev/null
          HOME="$SMOKE_HOME" make check-nvim-first-open

      - name: Ensure bootstrap does not modify the repo
        run: |
          status="$(git status --porcelain --ignored --untracked-files=all)"
          if [ -n "$status" ]; then
            printf '%s\n' "$status"
            exit 1
          fi
