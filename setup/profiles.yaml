# Profiles select shallow components. Tool versions stay in setup/tools.toml.
# Native packages, the machine-local package, and DESKTOP remain separate.
components:
  core:
    summary: Shell, Git, Vim, tmux, agent config and everyday CLI tools
    packages: [agents, bash, git, mise, scripts, tmux, vim, zsh]
    tools: [aqua:junegunn/fzf, aqua:BurntSushi/ripgrep, aqua:sharkdp/bat, aqua:dandavison/delta, aqua:ajeetdsouza/zoxide]
  atuin:
    summary: Shell history sync and search
    packages: [atuin]
    tools: [aqua:atuinsh/atuin]
  yazi:
    summary: Terminal file manager and shell navigation
    tools: [aqua:sxyazi/yazi]
  nvim:
    summary: Neovim editor, plugin configuration and Lua language server
    packages: [nvim]
    tools: [aqua:neovim/neovim, aqua:LuaLS/lua-language-server]
  herdr:
    summary: Herdr terminal workspace and agent integration config
    packages: [herdr]
  node:
    summary: Node runtime for locally installed CLI tools
    tools: [node]
  web-dev:
    summary: Node runtime and TypeScript language server
    tools: [node, npm:typescript-language-server]
  python-dev:
    summary: Python runtime, uv, basedpyright and Ruff
    tools: [python, aqua:astral-sh/uv, pipx:basedpyright, pipx:ruff]
  go-dev:
    summary: Go compiler and standard development tools
    tools: [go]
  rust-dev:
    summary: Rust toolchain, rustfmt and rust-analyzer
    tools: [rust]
  dev:
    summary: Compatibility bundle of all development tools
    tools: [go, node, python, rust, aqua:astral-sh/uv, npm:typescript-language-server, pipx:basedpyright, pipx:ruff, aqua:LuaLS/lua-language-server]
profiles:
  lite: [core]
  full: [core, atuin, yazi, nvim, herdr]
